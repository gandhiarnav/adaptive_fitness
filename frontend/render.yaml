services:
  - type: web
    name: adaptive-fitness-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://api.alphazero.dev"
    routes:
      # Redirect all 404s to index.html so React Router can handle client-side navigation
      - type: rewrite
        source: /*
        destination: /index.html
