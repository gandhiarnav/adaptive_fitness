services:
  - type: web
    name: adaptive-fitness-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false           # Set the value in the Render dashboard
      - key: DATABASE_URL
        sync: false           # Set the value in the Render dashboard (PostgreSQL connection string)
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ALLOWED_ORIGINS
        sync: false           # Set to: https://fit.alphazero.dev in the Render dashboard
